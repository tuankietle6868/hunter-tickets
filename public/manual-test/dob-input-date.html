<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Form Autofill — Native date input</title>
    <style>
      :root { color: #1f2328; background: #f6f8fa; font: 16px/1.5 system-ui, sans-serif; }
      body { max-width: 560px; margin: 40px auto; padding: 0 20px 48px; }
      form { display: grid; gap: 16px; padding: 22px; background: #fff; border: 1px solid #d0d7de; border-radius: 10px; }
      label { display: grid; gap: 5px; font-weight: 600; }
      input { min-height: 38px; padding: 7px 9px; font: inherit; border: 1px solid #8c959f; border-radius: 6px; }
      .note { color: #57606a; }
      output { min-height: 1.5em; color: #1a7f37; font-weight: 600; }
      code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    </style>
  </head>
  <body>
    <main>
      <h1>Fixture DOB: native date input</h1>
      <p class="note">Profile mẫu: <code>2000-05-12</code>. Giá trị DOM phải giữ đúng định dạng ISO <code>yyyy-mm-dd</code>.</p>

      <form id="dob-date-form" novalidate>
        <label for="date-of-birth">Ngày tháng năm sinh
          <input id="date-of-birth" name="dateOfBirth" type="date" autocomplete="bday" data-expected-value="2000-05-12" />
        </label>
        <output id="date-status" aria-live="polite">Chưa có giá trị.</output>
      </form>
    </main>

    <script>
      const dateOfBirth = document.querySelector("#date-of-birth");
      const status = document.querySelector("#date-status");
      dateOfBirth.addEventListener("input", () => {
        status.textContent = dateOfBirth.value
          ? `Giá trị ISO hiện tại: ${dateOfBirth.value}`
          : "Chưa có giá trị.";
      });
    </script>
  </body>
</html>
