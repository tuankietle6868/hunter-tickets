<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Form Autofill — Gender radio</title>
    <style>
      :root { color: #1f2328; background: #f6f8fa; font: 16px/1.5 system-ui, sans-serif; }
      body { max-width: 560px; margin: 40px auto; padding: 0 20px 48px; }
      fieldset { display: grid; gap: 12px; padding: 22px; background: #fff; border: 1px solid #d0d7de; border-radius: 10px; }
      legend { padding: 0 6px; font-weight: 700; }
      label { display: flex; align-items: center; gap: 8px; font-weight: 600; }
      input { width: 18px; height: 18px; }
      .note { color: #57606a; }
      output { display: block; min-height: 1.5em; margin-top: 16px; color: #1a7f37; font-weight: 600; }
      code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    </style>
  </head>
  <body>
    <main>
      <h1>Fixture radio: Giới tính</h1>
      <p class="note">Profile mẫu: <code>Nữ</code>. Chỉ radio khớp profile được chọn; không có submit tự động.</p>

      <form id="gender-radio-form" novalidate>
        <fieldset>
          <legend>Giới tính</legend>
          <label for="gender-male"><input id="gender-male" type="radio" name="gender" value="male" /> Nam</label>
          <label for="gender-female"><input id="gender-female" type="radio" name="gender" value="female" data-expected-checked="true" /> Nữ</label>
        </fieldset>
        <output id="gender-status" aria-live="polite">Chưa chọn giới tính.</output>
      </form>
    </main>

    <script>
      const radios = [...document.querySelectorAll("input[name='gender']")];
      const status = document.querySelector("#gender-status");
      radios.forEach((radio) => radio.addEventListener("change", () => {
        const selected = radios.find((option) => option.checked);
        status.textContent = selected
          ? `Đã chọn: ${selected.closest("label").textContent.trim()}`
          : "Chưa chọn giới tính.";
      }));
    </script>
  </body>
</html>
