<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Form Autofill — Pre-filled matching value</title>
    <style>
      :root { color: #1f2328; background: #f6f8fa; font: 16px/1.5 system-ui, sans-serif; }
      body { max-width: 640px; margin: 40px auto; padding: 0 20px 48px; }
      form { display: grid; gap: 16px; padding: 20px; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; }
      label { display: grid; gap: 6px; font-weight: 600; }
      input { box-sizing: border-box; min-height: 36px; padding: 4px 8px; font: inherit; }
      .note { color: #57606a; }
    </style>
  </head>
  <body>
    <main>
      <h1>Fixture H1 — Giá trị có sẵn khớp profile</h1>
      <p class="note">Giả lập browser autofill. Dùng profile có họ tên <strong>Nguyễn Văn An</strong> để kiểm thử.</p>

      <form id="prefilled-correct-form">
        <label for="full-name">
          Họ và tên
          <input id="full-name" name="fullName" type="text" autocomplete="name" value="Nguyễn Văn An" data-expected-status="prepopulated" />
        </label>
      </form>

      <p class="note"><strong>Kỳ vọng:</strong> giữ nguyên giá trị, không ghi đè; overlay hiển thị “đã có sẵn”.</p>
    </main>
  </body>
</html>
